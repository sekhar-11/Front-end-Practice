    <script>

            }
            else if (user_input < real_number) {

            }

                document.getElementById("result").innerHTML = "your number is greater than to real number"
            }
            else if(user_input == real_number){
                document.getElementById("result").innerHTML = "Congratulations 🥳🎉 You won " + "\n" + "you have guessed that number"
                document.getElementById()
            }
