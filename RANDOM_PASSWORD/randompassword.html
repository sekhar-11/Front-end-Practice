<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>security matters</title>
</head>
<style>
    .names{
        padding: 15px;
        float: left;
        text-align: right;
    }
    .values{
        padding: 15px;
        float: right;
        text-align: left;
    }
    form{
        align-items: center;
        text-align: center;
        margin-top: 15%;
        padding: 15px;
        padding-top: 25px;
        color: white;
        font-size: 20px;
        padding-bottom: 25px;
        background-color: rgba(128, 128, 128, 0.411);
    }
    body{
        background-image: url(../images/f.jpg);
        display: flex;
        background-size: cover;
        align-items: center;
        justify-content: center;
    }
    button{
        width: 100%;
    }
    input{
        width: 200px;
        color: white;
        background-color: rgba(128, 128, 128, 0);
        border: 1px solid rgba(128, 128, 128, 0);
        box-shadow: 0px 1px  rgba(228, 224, 224, 0.973);
    }
    button{
        background-color: rgba(128, 128, 128, 0.5);
        color: white;
        border: 1px solid rgba(231, 225, 225, 0.338);

    }
    .but{
        width: 45px;
        text-align: left;
        color: white;
        margin-left: 5px;
    }
</style> 
<body>
    <form>
        <fieldset>
            <legend>LOGIN</legend>
            <div class="names">
                <label>Username:</label><br><br>
                <label>Ex-Password:</label><br><br>
                <label>Password:</label>

            </div>
            <div class="values">
                <input type="text" id="username"><br><br>
                <input type="password" id="Password" onclick="generate()"><button type="button" onmouseover="show()" onmouseleave="hide()" class="but">show</button><br><br>
                <input type="password" id="mpassword" ondblclick="check()"><button type="button" onclick="copypass()" class="but">copy</button>

                <br><br>
            </div>
            <center><button type="button" onclick="check()">Login</button></center>
        </fieldset>
    </form>
    <script>
            let pwd = "";

        function generate(){
            const password = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890@!#$%&*()-_+/."
            const spc_chr = "@!#$%&*"
            const num = "1234567890"
            let userInput = prompt("Enter the password length");
            userInput = parseInt(userInput);
            if(userInput >=6){

            for(let i=0;i<userInput;i++){
                let index = (Math.floor(Math.random() * password.length));
                if(pwd == ""){
                    if(index<=25 && index>=0 ){
                        pwd = pwd + password[index];
                    }
                    else{
                        pwd="";
                        i--;
                    }
                }
                else if(pwd.length == Math.floor(Math.random()*pwd.length)){
                    index = Math.floor(Math.random().spc_chr.length)
                    pwd = pwd + spc_chr[index]
                }
               else if(pwd.length == Math.floor(Math.random()*pwd.length)){
                    index = Math.floor(Math.random().num.length)
                    pwd = pwd + num[index]
               }
                else{
                    
                    pwd = pwd + password[index];
                }
            }
        }else{
            window.alert("please Enter the password\ngreater than 5 characters")
        }
        console.log(pwd)
            document.getElementById("Password").value = pwd;
        }
        function copypass(){
            document.getElementById("mpassword").value = pwd;
        }
        function show(){
            document.getElementById("Password").type = "text";
            document.getElementById("mpassword").type = "text";
        }
        function hide(){
            document.getElementById("Password").type = "password";
            document.getElementById("mpassword").type = "password";
        }
        function check(){
            let user_pwd = document.getElementById("mpassword").value;
            const password = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890@!#$%&*()-_+/."
            const cap_pwd = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            const spc_chr = "@!#$%&*"
            const num = "1234567890"
            let counts = 0
            let countn = 0
            console.log(user_pwd)
           if(!(cap_pwd.includes(user_pwd[0]))){
            window.alert("Password first character\nmust contain capital\nTo make a strong password")
           }
           for(let i=0;i<user_pwd.length;i++){
            if(spc_chr.includes(user_pwd[i])){
                counts++;
            } }
            if(counts <=0){
                window.alert("password must contain Special character\nTo make a strong password")
            }
            for(let i=0;i<user_pwd.length;i++){
            if(num.includes(user_pwd[i])){
                countn++;
            } }
            if(countn <=0){
                window.alert("password must contain number\nTo make a strong password")
            }
        }
       
       
        
    
           
        

    </script>
</body>
</html>
